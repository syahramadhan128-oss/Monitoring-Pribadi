<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Keuangan Pribadi</title>

  <!-- PWA -->
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#16a34a">
  <meta name="description" content="Aplikasi untuk mencatat pemasukan dan pengeluaran pribadi.">

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      margin: 0;
      padding: 20px 15px;
      background: #f0fdf4;
      color: #1f2937;
    }

    .card {
      background: white;
      width: 100%;
      max-width: 500px;
      margin: 20px auto;
      padding: 24px;
      border-radius: 16px;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    h2 {
      text-align: center;
      color: #16a34a;
      margin-top: 0;
    }

    .subtitle {
      text-align: center;
      color: #6b7280;
      margin-bottom: 24px;
    }

    label {
      display: block;
      margin-top: 14px;
      font-weight: bold;
    }

    input,
    select {
      width: 100%;
      padding: 12px;
      margin-top: 5px;
      border: 1px solid #d1d5db;
      border-radius: 8px;
      font-size: 16px;
    }

    button {
      width: 100%;
      margin-top: 20px;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #16a34a;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #15803d;
    }

    .note {
      margin-top: 15px;
      font-size: 12px;
      color: #6b7280;
      text-align: center;
    }
  </style>
</head>

<body>

  <main class="card">
    <h2>💰 Keuangan Pribadi</h2>
    <p class="subtitle">Catat pemasukan dan pengeluaran Anda</p>

    <form id="formKeuangan">

      <label>Tanggal Transaksi</label>
      <input type="date" id="tanggal" required>

      <label>Jenis Transaksi</label>
      <select id="jenis">
        <option value="Masuk">Pemasukan</option>
        <option value="Keluar">Pengeluaran</option>
      </select>

      <label>Kategori</label>
      <input
        type="text"
        id="kategori"
        placeholder="Contoh: Gaji, Makanan, Transportasi">

      <label>Deskripsi</label>
      <input
        type="text"
        id="deskripsi"
        placeholder="Keterangan transaksi">

      <label>Nominal (Rp)</label>
      <input
        type="number"
        id="nominal"
        placeholder="Contoh: 50000"
        required>

      <button type="submit" id="tombolSimpan">
        Simpan Transaksi
      </button>

    </form>

    <p class="note">
      Pastikan data sudah benar sebelum disimpan.
    </p>

  </main>

  <script>

    const API_URL =
    "https://script.google.com/macros/s/AKfycbyzy9XLvpx5DSZSrOmNvL40gTeITz6WxuvMduKe9kBFDZIvuQwngtUgRMOrT_68GTxH/exec";

    // Isi tanggal hari ini
    document.getElementById("tanggal").value =
      new Date().toISOString().split("T")[0];

    document
      .getElementById("formKeuangan")
      .addEventListener("submit", async function (e) {

        e.preventDefault();

        const tombol =
          document.getElementById("tombolSimpan");

        tombol.disabled = true;
        tombol.textContent = "Mengirim...";

        const data = {
          tanggal: document.getElementById("tanggal").value,
          jenis: document.getElementById("jenis").value,
          kategori: document.getElementById("kategori").value,
          deskripsi: document.getElementById("deskripsi").value,
          nominal: document.getElementById("nominal").value
        };

        try {

          await fetch(API_URL, {
            method: "POST",
            mode: "no-cors",
            body: JSON.stringify(data)
          });

          alert("Data berhasil dikirim.");

          document.getElementById("kategori").value = "";
          document.getElementById("deskripsi").value = "";
          document.getElementById("nominal").value = "";

        } catch (err) {

          console.error(err);
          alert("Gagal mengirim data.");

        } finally {

          tombol.disabled = false;
          tombol.textContent = "Simpan Transaksi";

        }

      });

    // Registrasi Service Worker
    if ("serviceWorker" in navigator) {
      window.addEventListener("load", () => {
        navigator.serviceWorker
          .register("./sw.js")
          .then(() => console.log("Service Worker aktif"))
          .catch(err => console.error(err));
      });
    }

  </script>

</body>
</html>
