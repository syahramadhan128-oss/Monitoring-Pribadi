<!DOCTYPE html><html lang="id"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0"><title>Laporan Keuangan</title><link rel="manifest" href="manifest.json"><meta name="theme-color" content="#16a34a"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script><style>*{margin:0;padding:0;box-sizing:border-box;font-family:Arial,sans-serif}body{background:#f0fdf4;padding:15px;padding-bottom:100px}.container{max-width:900px;margin:auto}.header{text-align:center;margin-bottom:15px}.header h1{color:#16a34a}.card{background:#fff;padding:15px;margin-bottom:15px;border-radius:15px;box-shadow:0 2px 8px rgba(0,0,0,.1)}.filter{width:100%;padding:10px;border-radius:10px;border:1px solid #ddd}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.box{padding:15px;border-radius:12px;color:#fff;text-align:center}.masuk{background:#2563eb}.keluar{background:#dc2626}.saldo{background:#16a34a}.box p{margin-top:10px;font-size:22px;font-weight:bold}table{width:100%;border-collapse:collapse}th{background:#16a34a;color:#fff;padding:10px}td{padding:10px;border-bottom:1px solid #eee}.bottom-nav{position:fixed;left:0;right:0;bottom:0;background:#fff;box-shadow:0 -2px 10px rgba(0,0,0,.1);display:flex;justify-content:space-around;padding:10px;z-index:9999}.bottom-nav a{text-decoration:none;color:#444;font-size:14px;text-align:center}.active{color:#16a34a!important;font-weight:bold}canvas{max-height:420px}@media(max-width:600px){.grid{grid-template-columns:1fr}}</style></head><body><div class="container"><div class="header"><h1>📊 Laporan Keuangan</h1><p>Rekapitulasi Pemasukan dan Pengeluaran</p></div><div class="card"><h3>📅 Filter Periode</h3><br><select id="filterBulan" class="filter"><option value="all">Semua Transaksi</option></select></div><div class="grid"><div class="box masuk"><div>Total Pemasukan</div><p id="totalMasuk">Rp 0</p></div><div class="box keluar"><div>Total Pengeluaran</div><p id="totalKeluar">Rp 0</p></div><div class="box saldo"><div>Saldo</div><p id="saldo">Rp 0</p></div></div><br><div class="card"><h3>📊 Pemasukan vs Pengeluaran per Kategori</h3><br><canvas id="barChart"></canvas></div><div class="card"><h3>📋 Ringkasan Kategori</h3><br><table><thead><tr><th>Jenis</th><th>Kategori</th><th>Total</th></tr></thead><tbody id="laporanBody"></tbody></table></div></div><div class="bottom-nav"><a href="index.html">🏠<br>Dashboard</a><a href="transaksi.html">➕<br>Transaksi</a><a href="laporan.html" class="active">📊<br>Laporan</a><a href="profil.html">⚙️<br>Profil</a></div><script>const API_URL='https://script.google.com/macros/s/AKfycbyzy9XLvpx5DSZSrOmNvL40gTeITz6WxuvMduKe9kBFDZIvuQwngtUgRMOrT_68GTxH/exec';let chart=null;function rupiah(n){return 'Rp '+Number(n||0).toLocaleString('id-ID')}function loadFilter(data){const s=new Set();data.forEach(i=>{if(i.tanggal)s.add(i.tanggal.substring(0,7))});const sel=document.getElementById('filterBulan');const cur=sel.value;sel.innerHTML='<option value="all">Semua Transaksi</option>';[...s].sort().reverse().forEach(b=>sel.innerHTML+=`<option value="${b}">${b}</option>`);if(cur)sel.value=cur}async function loadLaporan(){try{const r=await fetch(API_URL);const data=await r.json();loadFilter(data);const filter=document.getElementById('filterBulan').value;let filtered=data;if(filter!=='all'){filtered=data.filter(i=>i.tanggal&&i.tanggal.startsWith(filter))}let masuk=0,keluar=0;const kategoriMap={},rekap={};filtered.forEach(item=>{const nominal=Number(item.nominal||0);const jenis=String(item.jenis||'').toLowerCase();if(jenis==='masuk'||jenis==='pemasukan'){masuk+=nominal}else{keluar+=nominal;const k=item.kategori||'Lainnya';kategoriMap[k]=(kategoriMap[k]||0)+nominal}const key=(item.jenis||'')+'|'+(item.kategori||'');if(!rekap[key])rekap[key]={jenis:item.jenis,kategori:item.kategori,total:0};rekap[key].total+=nominal});document.getElementById('totalMasuk').innerText=rupiah(masuk);document.getElementById('totalKeluar').innerText=rupiah(keluar);document.getElementById('saldo').innerText=rupiah(masuk-keluar);const labels=Object.keys(kategoriMap);const dataPengeluaran=Object.values(kategoriMap);const kategoriMasuk={};filtered.forEach(item=>{const nominal=Number(item.nominal||0);const jenis=String(item.jenis||'').toLowerCase();if(jenis==='masuk'||jenis==='pemasukan'){const k=item.kategori||'Lainnya';kategoriMasuk[k]=(kategoriMasuk[k]||0)+nominal}});const dataPemasukan=labels.map(l=>kategoriMasuk[l]||0);if(chart)chart.destroy();chart=new Chart(document.getElementById('barChart'),{data:{labels:labels,datasets:[{type:'bar',label:'Pengeluaran',data:dataPengeluaran,backgroundColor:'#dc2626',borderRadius:8},{type:'line',label:'Pemasukan',data:dataPemasukan,borderColor:'#2563eb',backgroundColor:'#2563eb',borderWidth:3,pointRadius:5,fill:false,tension:.4}]},options:{responsive:true,interaction:{mode:'index',intersect:false},plugins:{legend:{display:true}}}});let html='';Object.values(rekap).sort((a,b)=>b.total-a.total).forEach(item=>{html+=`<tr><td>${item.jenis||'-'}</td><td>${item.kategori||'-'}</td><td>${rupiah(item.total)}</td></tr>`});if(html===''){html='<tr><td colspan="3" style="text-align:center">Tidak ada data</td></tr>'}document.getElementById('laporanBody').innerHTML=html}catch(e){console.error(e)}}document.getElementById('filterBulan').addEventListener('change',loadLaporan);loadLaporan();</script></body></html>
