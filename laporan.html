<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Keuangan</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0fdf4;
    padding:15px;
    padding-bottom:100px;
}

.container{
    max-width:1000px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    color:#16a34a;
}

.card{
    background:#fff;
    padding:15px;
    border-radius:15px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
    margin-bottom:15px;
}

.summary{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:10px;
}

.box{
    background:#f8fafc;
    padding:15px;
    border-radius:12px;
    text-align:center;
}

.box h3{
    font-size:14px;
    color:#666;
}

.box p{
    font-size:20px;
    font-weight:bold;
    margin-top:5px;
}

.income{
    color:#16a34a;
}

.expense{
    color:#dc2626;
}

.balance{
    color:#2563eb;
}

select{
    width:100%;
    padding:12px;
    border-radius:10px;
    border:1px solid #ddd;
}

table{
    width:100%;
    border-collapse:collapse;
}

th,td{
    padding:10px;
    border-bottom:1px solid #eee;
    text-align:left;
}

th{
    background:#16a34a;
    color:white;
}

.loading{
    text-align:center;
    padding:20px;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    width:100%;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:10px;
    box-shadow:0 -2px 8px rgba(0,0,0,.15);
}

.bottom-nav a{
    text-decoration:none;
    color:#16a34a;
    font-weight:bold;
}

@media(max-width:600px){
.summary{
    grid-template-columns:1fr;
}
}
</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>Laporan Keuangan</h1>
</div>

<div class="card">
    <select id="bulanFilter">
        <option value="">Semua Bulan</option>
    </select>
</div>

<div class="card">
    <div class="summary">
        <div class="box">
            <h3>Pemasukan</h3>
            <p class="income" id="totalMasuk">Rp 0</p>
        </div>

        <div class="box">
            <h3>Pengeluaran</h3>
            <p class="expense" id="totalKeluar">Rp 0</p>
        </div>

        <div class="box">
            <h3>Saldo</h3>
            <p class="balance" id="saldo">Rp 0</p>
        </div>
    </div>
</div>

<div class="card">
    <canvas id="grafik"></canvas>
</div>

<div class="card">
    <table>
        <thead>
            <tr>
                <th>Tanggal</th>
                <th>Jenis</th>
                <th>Kategori</th>
                <th>Nominal</th>
            </tr>
        </thead>
        <tbody id="tbodyData">
        </tbody>
    </table>
</div>

</div>

<div class="bottom-nav">
    <a href="index.html">Beranda</a>
    <a href="transaksi.html">Transaksi</a>
    <a href="laporan.html">Laporan</a>
    <a href="profil.html">Profil</a>
</div>

<script>

const API_URL = "GANTI_DENGAN_URL_APPS_SCRIPT_ANDA";

let chart;
let semuaData = [];

function formatRupiah(nilai){
    return "Rp " + Number(nilai).toLocaleString("id-ID");
}

function isiFilterBulan(data){

    const filter = document.getElementById("bulanFilter");

    const bulanSet = new Set();

    data.forEach(item=>{
        if(item.tanggal){
            bulanSet.add(item.tanggal.substring(0,7));
        }
    });

    [...bulanSet].sort().forEach(bulan=>{
        const option = document.createElement("option");
        option.value = bulan;
        option.textContent = bulan;
        filter.appendChild(option);
    });
}

function render(data){

    let masuk = 0;
    let keluar = 0;

    const tbody = document.getElementById("tbodyData");
    tbody.innerHTML="";

    data.forEach(row=>{

        let nominal = Number(row.nominal || 0);

        if(
            row.jenis &&
            row.jenis.toLowerCase() === "pemasukan"
        ){
            masuk += nominal;
        }else{
            keluar += nominal;
        }

        tbody.innerHTML += `
        <tr>
            <td>${row.tanggal || ""}</td>
            <td>${row.jenis || ""}</td>
            <td>${row.kategori || ""}</td>
            <td>${formatRupiah(nominal)}</td>
        </tr>
        `;
    });

    document.getElementById("totalMasuk").textContent =
        formatRupiah(masuk);

    document.getElementById("totalKeluar").textContent =
        formatRupiah(keluar);

    document.getElementById("saldo").textContent =
        formatRupiah(masuk-keluar);

    const ctx = document.getElementById("grafik");

    if(chart){
        chart.destroy();
    }

    chart = new Chart(ctx,{
        type:'doughnut',
        data:{
            labels:['Pemasukan','Pengeluaran'],
            datasets:[{
                data:[masuk,keluar],
                backgroundColor:[
                    '#16a34a',
                    '#dc2626'
                ]
            }]
        }
    });
}

async function loadData(){

    try{

        const response = await fetch(API_URL);
        const result = await response.json();

        console.log(result);

        semuaData = Array.isArray(result)
            ? result
            : (result.data || []);

        isiFilterBulan(semuaData);
        render(semuaData);

    }catch(error){

        console.error(error);

        document.body.innerHTML += `
        <div style="padding:20px;color:red">
            Gagal mengambil data dari Apps Script.
            Silakan cek URL API Anda.
        </div>`;
    }
}

document
.getElementById("bulanFilter")
.addEventListener("change", function(){

    const bulan = this.value;

    if(!bulan){
        render(semuaData);
        return;
    }

    const filtered = semuaData.filter(item =>
        item.tanggal &&
        item.tanggal.startsWith(bulan)
    );

    render(filtered);
});

loadData();

</script>

</body>
</html>
