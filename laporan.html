<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Keuangan</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:100px;
}

.container{
max-width:1000px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#16a34a;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
margin-bottom:15px;
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.box{
padding:15px;
border-radius:12px;
text-align:center;
background:#f8fafc;
}

.box h3{
font-size:14px;
margin-bottom:5px;
}

.box p{
font-size:20px;
font-weight:bold;
}

.income{
color:#16a34a;
}

.expense{
color:#dc2626;
}

.balance{
color:#2563eb;
}

select{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
}

table{
width:100%;
border-collapse:collapse;
}

th,td{
padding:10px;
border-bottom:1px solid #eee;
text-align:left;
font-size:14px;
}

th{
background:#16a34a;
color:white;
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:#fff;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
z-index:9999;
}

.bottom-nav a{
text-decoration:none;
color:#444;
font-size:14px;
text-align:center;
}

.active{
color:#16a34a !important;
font-weight:bold;
}

.loading{
text-align:center;
padding:20px;
color:#666;
}

@media(max-width:600px){

.summary{
grid-template-columns:1fr;
}

th,td{
font-size:12px;
}

}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>📊 Laporan Keuangan</h1>
</div>

<div class="card">

<select id="bulanFilter">
<option value="">Semua Bulan</option>
</select>

</div>

<div class="card">

<div class="summary">

<div class="box">
<h3>Pemasukan</h3>
<p class="income" id="totalMasuk">Rp 0</p>
</div>

<div class="box">
<h3>Pengeluaran</h3>
<p class="expense" id="totalKeluar">Rp 0</p>
</div>

<div class="box">
<h3>Saldo</h3>
<p class="balance" id="saldo">Rp 0</p>
</div>

</div>

</div>

<div class="card">
<canvas id="grafik"></canvas>
</div>

<div class="card">

<table>

<thead>
<tr>
<th>Tanggal</th>
<th>Jenis</th>
<th>Kategori</th>
<th>Nominal</th>
</tr>
</thead>

<tbody id="tbodyData">
<tr>
<td colspan="4" class="loading">
Memuat data...
</td>
</tr>
</tbody>

</table>

</div>

</div>

<div class="bottom-nav">

<a href="index.html">
🏠<br>Dashboard
</a>

<a href="transaksi.html">
➕<br>Transaksi
</a>

<a href="laporan.html" class="active">
📊<br>Laporan
</a>

<a href="profil.html">
⚙️<br>Profil
</a>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyzy9XLvpx5DSZSrOmNvL40gTeITz6WxuvMduKe9kBFDZIvuQwngtUgRMOrT_68GTxH/exec";

let chart;
let semuaData = [];

function formatRupiah(nilai){

return "Rp " +
Number(nilai || 0)
.toLocaleString("id-ID");

}

function isiFilterBulan(data){

const filter =
document.getElementById("bulanFilter");

filter.innerHTML =
'<option value="">Semua Bulan</option>';

const bulanSet =
new Set();

data.forEach(item=>{

if(item.tanggal){

bulanSet.add(
item.tanggal.substring(0,7)
);

}

});

[...bulanSet]
.sort()
.reverse()
.forEach(bulan=>{

const option =
document.createElement("option");

option.value = bulan;
option.textContent = bulan;

filter.appendChild(option);

});

}

function render(data){

let masuk = 0;
let keluar = 0;

const tbody =
document.getElementById("tbodyData");

tbody.innerHTML = "";

data.forEach(row=>{

const nominal =
Number(row.nominal || 0);

const jenis =
String(row.jenis || "")
.toLowerCase();

if(
jenis === "masuk" ||
jenis === "pemasukan"
){

masuk += nominal;

}else{

keluar += nominal;

}

tbody.innerHTML += `
<tr>
<td>${row.tanggal || ""}</td>
<td>${row.jenis || ""}</td>
<td>${row.kategori || ""}</td>
<td>${formatRupiah(nominal)}</td>
</tr>
`;

});

document.getElementById("totalMasuk")
.textContent =
formatRupiah(masuk);

document.getElementById("totalKeluar")
.textContent =
formatRupiah(keluar);

document.getElementById("saldo")
.textContent =
formatRupiah(masuk-keluar);

const ctx =
document.getElementById("grafik");

if(chart){
chart.destroy();
}

chart =
new Chart(ctx,{
type:"doughnut",
data:{
labels:[
"Pemasukan",
"Pengeluaran"
],
datasets:[{
data:[
masuk,
keluar
],
backgroundColor:[
"#16a34a",
"#dc2626"
]
}]
}
});

if(data.length===0){

tbody.innerHTML =
`
<tr>
<td colspan="4"
style="text-align:center;">
Tidak ada data
</td>
</tr>
`;

}

}

async function loadData(){

try{

const response =
await fetch(API_URL);

const data =
await response.json();

console.log("DATA API",data);

if(!Array.isArray(data)){
throw new Error("Format JSON tidak valid");
}

semuaData = data;

isiFilterBulan(data);

render(data);

}catch(error){

console.error(error);

document.getElementById(
"tbodyData"
).innerHTML =
`
<tr>
<td colspan="4"
style="color:red;text-align:center;">
Gagal mengambil data
</td>
</tr>
`;

}

}

document
.getElementById("bulanFilter")
.addEventListener(
"change",
function(){

const bulan =
this.value;

if(!bulan){

render(semuaData);
return;

}

const filtered =
semuaData.filter(item=>

item.tanggal &&
item.tanggal.startsWith(bulan)

);

render(filtered);

}
);

loadData();

if("serviceWorker" in navigator){

navigator.serviceWorker
.register("sw.js")
.then(()=>{
console.log(
"Service Worker aktif"
);
})
.catch(err=>{
console.error(err);
});

}

</script>

</body>
</html>
