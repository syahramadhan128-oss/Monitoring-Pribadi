<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Laporan Keuangan</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:90px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:15px;
}

.header h1{
color:#16a34a;
}

.card{
background:#fff;
padding:15px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.filter{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
}

.summary{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.box{
padding:15px;
border-radius:12px;
text-align:center;
color:white;
}

.masuk{
background:#2563eb;
}

.keluar{
background:#dc2626;
}

.saldo{
background:#16a34a;
}

.box h3{
margin-top:8px;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#16a34a;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #ddd;
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:#fff;
display:flex;
justify-content:space-around;
padding:10px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#444;
font-size:14px;
text-align:center;
}

.active{
color:#16a34a !important;
font-weight:bold;
}

@media(max-width:600px){

.summary{
grid-template-columns:1fr;
}

}

</style>
</head>
<body>

<div class="container">

<div class="header">
<h1>📊 Laporan Keuangan</h1>
<p>Analisa Pemasukan dan Pengeluaran</p>
</div>

<div class="card">

<h3>📅 Filter Bulan</h3>
<br>

<input type="month"
id="filterBulan"
class="filter">

</div>

<div class="summary">

<div class="box masuk">
<div>Pemasukan</div>
<h3 id="totalMasuk">Rp 0</h3>
</div>

<div class="box keluar">
<div>Pengeluaran</div>
<h3 id="totalKeluar">Rp 0</h3>
</div>

<div class="box saldo">
<div>Saldo</div>
<h3 id="saldo">Rp 0</h3>
</div>

</div>

<br>

<div class="card">

<h3>📈 Grafik Pengeluaran per Kategori</h3>

<br>

<canvas id="barChart"></canvas>

</div>

<div class="card">

<h3>📋 Ringkasan Kategori</h3>

<br>

<table>

<thead>

<tr>
<th>Jenis</th>
<th>Kategori</th>
<th>Total</th>
</tr>

</thead>

<tbody id="laporanBody"></tbody>

</table>

</div>

</div>

<div class="bottom-nav">

<a href="index.html">
🏠<br>Dashboard
</a>

<a href="transaksi.html">
➕<br>Transaksi
</a>

<a href="laporan.html" class="active">
📊<br>Laporan
</a>

<a href="profil.html">
⚙️<br>Profil
</a>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyzy9XLvpx5DSZSrOmNvL40gTeITz6WxuvMduKe9kBFDZIvuQwngtUgRMOrT_68GTxH/exec";

let chart = null;

function rupiah(n){

return "Rp " +
Number(n || 0)
.toLocaleString("id-ID");

}

function setDefaultMonth(){

const now = new Date();

document.getElementById("filterBulan").value =
`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;

}

async function loadLaporan(){

const response =
await fetch(API_URL);

const data =
await response.json();

const bulan =
document.getElementById("filterBulan").value;

const filtered =
data.filter(item=>{

if(!bulan) return true;

return item.tanggal &&
item.tanggal.startsWith(bulan);

});

let masuk = 0;
let keluar = 0;

const kategoriMap = {};
const rekapKategori = {};

filtered.forEach(item=>{

const nominal =
Number(item.nominal || 0);

const jenis =
(item.jenis || "")
.toLowerCase();

if(
jenis==="masuk" ||
jenis==="pemasukan"
){

masuk += nominal;

}else{

keluar += nominal;

const kategori =
item.kategori || "Lainnya";

kategoriMap[kategori] =
(kategoriMap[kategori]||0)
+ nominal;

}

const key =
`${item.jenis}|${item.kategori}`;

if(!rekapKategori[key]){

rekapKategori[key]={
jenis:item.jenis,
kategori:item.kategori,
total:0
};

}

rekapKategori[key].total += nominal;

});

document.getElementById("totalMasuk").innerText =
rupiah(masuk);

document.getElementById("totalKeluar").innerText =
rupiah(keluar);

document.getElementById("saldo").innerText =
rupiah(masuk-keluar);

const labels =
Object.keys(kategoriMap);

const values =
Object.values(kategoriMap);

if(chart){

chart.destroy();

}

chart =
new Chart(
document.getElementById("barChart"),
{
type:"bar",
data:{
labels:labels,
datasets:[{
label:"Pengeluaran",
data:values,
backgroundColor:"#16a34a"
}]
},
options:{
responsive:true,
plugins:{
legend:{
display:false
}
}
}
}
);

let html = "";

Object.values(rekapKategori)
.sort((a,b)=>b.total-a.total)
.forEach(item=>{

html += `
<tr>
<td>${item.jenis}</td>
<td>${item.kategori}</td>
<td>${rupiah(item.total)}</td>
</tr>
`;

});

document.getElementById("laporanBody")
.innerHTML =
html ||
`
<tr>
<td colspan="3">
Tidak ada data
</td>
</tr>
`;

}

document
.getElementById("filterBulan")
.addEventListener(
"change",
loadLaporan
);

setDefaultMonth();
loadLaporan();

</script>

</body>
</html>
