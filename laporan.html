<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Keuangan</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
    font-family:Arial,sans-serif;
    background:#f4f7f6;
    padding:20px;
}

.card{
    background:white;
    padding:20px;
    margin-bottom:20px;
    border-radius:12px;
    box-shadow:0 2px 8px rgba(0,0,0,.1);
}

h2{
    margin-bottom:20px;
}

select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#16a34a;
    color:white;
    padding:10px;
    text-align:left;
}

td{
    padding:10px;
    border-bottom:1px solid #ddd;
}

canvas{
    max-height:450px;
}

</style>
</head>
<body>

<h2>📊 Laporan Keuangan</h2>

<div class="card">

    <label><b>Filter Periode</b></label>

    <br><br>

    <select id="filterBulan">
        <option value="all">Semua Data</option>
    </select>

</div>

<div class="card">

    <h3>Diagram Total per Kategori</h3>

    <canvas id="barChart"></canvas>

</div>

<div class="card">

    <h3>Ringkasan Kategori</h3>

    <table>

        <thead>
            <tr>
                <th>Jenis</th>
                <th>Kategori</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody id="laporanKategori"></tbody>

    </table>

</div>

<script>

let chartKategori = null;

/*
==================================
AMBIL DATA TRANSAKSI
==================================
*/

const transaksi =
JSON.parse(localStorage.getItem("transaksi")) || [];

/*
==================================
FORMAT RUPIAH
==================================
*/

function formatRupiah(angka){

    return "Rp " +
    Number(angka).toLocaleString("id-ID");

}

/*
==================================
LOAD BULAN
==================================
*/

function loadBulan(){

    const bulanSet = new Set();

    transaksi.forEach(item=>{

        if(item.tanggal){

            bulanSet.add(
                item.tanggal.substring(0,7)
            );

        }

    });

    const select =
    document.getElementById("filterBulan");

    [...bulanSet]
    .sort()
    .forEach(bln=>{

        select.innerHTML += `
        <option value="${bln}">
        ${bln}
        </option>
        `;

    });

}

/*
==================================
FILTER DATA
==================================
*/

function getDataFilter(){

    const bulan =
    document.getElementById("filterBulan").value;

    if(bulan==="all"){

        return transaksi;

    }

    return transaksi.filter(item =>
        item.tanggal.substring(0,7)===bulan
    );

}

/*
==================================
TABEL RINGKASAN
==================================
*/

function renderTabel(){

    const data = getDataFilter();

    const rekap = {};

    data.forEach(item=>{

        const key =
        item.jenis + "|" + item.kategori;

        if(!rekap[key]){

            rekap[key]={
                jenis:item.jenis,
                kategori:item.kategori,
                total:0
            };

        }

        rekap[key].total +=
        Number(item.nominal);

    });

    let html="";

    Object.values(rekap)
    .sort((a,b)=>b.total-a.total)
    .forEach(item=>{

        html += `
        <tr>
            <td>${item.jenis}</td>
            <td>${item.kategori}</td>
            <td>${formatRupiah(item.total)}</td>
        </tr>
        `;

    });

    document.getElementById(
        "laporanKategori"
    ).innerHTML = html;

}

/*
==================================
GRAFIK BATANG
==================================
*/

function renderChart(){

    const data = getDataFilter();

    const kategoriMap = {};

    data.forEach(item=>{

        if(!kategoriMap[item.kategori]){

            kategoriMap[item.kategori]=0;

        }

        kategoriMap[item.kategori] +=
        Number(item.nominal);

    });

    const labels =
    Object.keys(kategoriMap);

    const values =
    Object.values(kategoriMap);

    const ctx =
    document
    .getElementById("barChart")
    .getContext("2d");

    if(chartKategori){

        chartKategori.destroy();

    }

    chartKategori = new Chart(ctx,{

        type:"bar",

        data:{

            labels:labels,

            datasets:[{

                label:"Total Nominal",

                data:values,

                backgroundColor:[
                    "#22c55e",
                    "#3b82f6",
                    "#f59e0b",
                    "#ef4444",
                    "#8b5cf6",
                    "#14b8a6"
                ]

            }]

        },

        options:{

            responsive:true,

            plugins:{
                legend:{
                    display:false
                }
            },

            scales:{

                y:{

                    beginAtZero:true

                }

            }

        }

    });

}

/*
==================================
FILTER CHANGE
==================================
*/

document
.getElementById("filterBulan")
.addEventListener("change",()=>{

    renderTabel();

    renderChart();

});

/*
==================================
LOAD AWAL
==================================
*/

loadBulan();

renderTabel();

renderChart();

</script>

</body>
</html>
