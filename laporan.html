<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Keuangan</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:Arial, sans-serif;
    background:#f4f7f6;
    padding:20px;
}

h2{
    margin-bottom:20px;
}

.card{
    background:#fff;
    padding:20px;
    border-radius:12px;
    margin-bottom:20px;
    box-shadow:0 2px 8px rgba(0,0,0,0.1);
}

.summary{
    display:flex;
    gap:15px;
    flex-wrap:wrap;
}

.summary-card{
    flex:1;
    min-width:200px;
    padding:15px;
    border-radius:12px;
}

.masuk{
    background:#dcfce7;
}

.keluar{
    background:#fee2e2;
}

.saldo{
    background:#dbeafe;
}

.summary-card h4{
    margin-bottom:10px;
}

.summary-card h2{
    margin:0;
}

select{
    padding:10px;
    border:1px solid #ccc;
    border-radius:8px;
}

table{
    width:100%;
    border-collapse:collapse;
}

th{
    background:#16a34a;
    color:white;
    padding:12px;
    text-align:left;
}

td{
    padding:12px;
    border-bottom:1px solid #ddd;
}

canvas{
    width:100% !important;
    max-height:450px;
}

</style>
</head>
<body>

<h2>📊 Laporan Keuangan</h2>

<div class="card">

    <div class="summary">

        <div class="summary-card masuk">
            <h4>Total Masuk</h4>
            <h2 id="totalMasuk">Rp 0</h2>
        </div>

        <div class="summary-card keluar">
            <h4>Total Keluar</h4>
            <h2 id="totalKeluar">Rp 0</h2>
        </div>

        <div class="summary-card saldo">
            <h4>Saldo</h4>
            <h2 id="saldo">Rp 0</h2>
        </div>

    </div>

</div>

<div class="card">

    <label><b>Filter Periode</b></label>
    <br><br>

    <select id="filterBulan">
        <option value="all">Semua Data</option>
    </select>

</div>

<div class="card">

    <h3>Diagram Pengeluaran Per Kategori</h3>

    <br>

    <canvas id="barChart"></canvas>

</div>

<div class="card">

    <h3>Ringkasan Kategori</h3>

    <br>

    <table>

        <thead>
            <tr>
                <th>Jenis</th>
                <th>Kategori</th>
                <th>Total</th>
            </tr>
        </thead>

        <tbody id="laporanKategori"></tbody>

    </table>

</div>

<script>

let chartKategori = null;

/* =========================
   DATA TRANSAKSI
========================= */

const transaksi =
JSON.parse(localStorage.getItem("transaksi")) || [];

/* =========================
   FORMAT RUPIAH
========================= */

function formatRupiah(angka){

    return "Rp " +
    Number(angka).toLocaleString("id-ID");

}

/* =========================
   LOAD BULAN
========================= */

function loadBulan(){

    const bulanSet = new Set();

    transaksi.forEach(item=>{

        if(item.tanggal){

            bulanSet.add(
                item.tanggal.substring(0,7)
            );

        }

    });

    const select =
    document.getElementById("filterBulan");

    [...bulanSet]
    .sort()
    .forEach(bln=>{

        select.innerHTML += `
        <option value="${bln}">
            ${bln}
        </option>
        `;

    });

}

/* =========================
   FILTER DATA
========================= */

function getDataFilter(){

    const bulan =
    document.getElementById("filterBulan").value;

    if(bulan==="all"){

        return transaksi;

    }

    return transaksi.filter(item=>
        item.tanggal.substring(0,7)===bulan
    );

}

/* =========================
   SUMMARY
========================= */

function renderSummary(){

    const data = getDataFilter();

    let masuk = 0;
    let keluar = 0;

    data.forEach(item=>{

        if(
            item.jenis &&
            item.jenis.toLowerCase()==="masuk"
        ){
            masuk += Number(item.nominal);
        }else{
            keluar += Number(item.nominal);
        }

    });

    document.getElementById("totalMasuk")
        .innerText = formatRupiah(masuk);

    document.getElementById("totalKeluar")
        .innerText = formatRupiah(keluar);

    document.getElementById("saldo")
        .innerText = formatRupiah(masuk-keluar);

}

/* =========================
   TABEL REKAP
========================= */

function renderTabel(){

    const data = getDataFilter();

    const rekap = {};

    data.forEach(item=>{

        const key =
        item.jenis + "|" + item.kategori;

        if(!rekap[key]){

            rekap[key] = {
                jenis:item.jenis,
                kategori:item.kategori,
                total:0
            };

        }

        rekap[key].total += Number(item.nominal);

    });

    let html = "";

    if(Object.keys(rekap).length===0){

        html = `
        <tr>
            <td colspan="3" style="text-align:center">
                Tidak ada data transaksi
            </td>
        </tr>
        `;

    }else{

        Object.values(rekap)
        .sort((a,b)=>b.total-a.total)
        .forEach(item=>{

            html += `
            <tr>
                <td>${item.jenis}</td>
                <td>${item.kategori}</td>
                <td>${formatRupiah(item.total)}</td>
            </tr>
            `;

        });

    }

    document.getElementById(
        "laporanKategori"
    ).innerHTML = html;

}

/* =========================
   GRAFIK BATANG
========================= */

function renderChart(){

    const data = getDataFilter();

    const kategoriMap = {};

    data.forEach(item=>{

        if(
            item.jenis &&
            item.jenis.toLowerCase()==="keluar"
        ){

            if(!kategoriMap[item.kategori]){

                kategoriMap[item.kategori]=0;

            }

            kategoriMap[item.kategori] +=
            Number(item.nominal);
        }

    });

    const labels =
    Object.keys(kategoriMap);

    const values =
    Object.values(kategoriMap);

    const ctx =
    document
    .getElementById("barChart")
    .getContext("2d");

    if(chartKategori){

        chartKategori.destroy();

    }

    chartKategori = new Chart(ctx,{

        type:"bar",

        data:{

            labels:labels,

            datasets:[{

                label:"Total Pengeluaran",

                data:values,

                backgroundColor:"#22c55e"

            }]

        },

        options:{

            responsive:true,

            plugins:{
                legend:{
                    display:false
                }
            },

            scales:{

                y:{
                    beginAtZero:true,
                    ticks:{
                        callback:function(value){
                            return "Rp " +
                            value.toLocaleString("id-ID");
                        }
                    }
                }

            }

        }

    });

}

/* =========================
   EVENT FILTER
========================= */

document
.getElementById("filterBulan")
.addEventListener("change",()=>{

    renderSummary();
    renderTabel();
    renderChart();

});

/* =========================
   LOAD AWAL
========================= */

loadBulan();

renderSummary();
renderTabel();
renderChart();

</script>

</body>
</html>
