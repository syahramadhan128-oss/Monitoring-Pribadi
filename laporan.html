<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Laporan Keuangan</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:100px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:15px;
}

.header h1{
color:#16a34a;
}

.card{
background:white;
padding:15px;
margin-bottom:15px;
border-radius:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.filter{
width:100%;
padding:10px;
border:1px solid #ddd;
border-radius:10px;
}

.grid{
display:grid;
grid-template-columns:repeat(3,1fr);
gap:10px;
}

.box{
padding:15px;
border-radius:12px;
text-align:center;
color:white;
}

.masuk{
background:#2563eb;
}

.keluar{
background:#dc2626;
}

.saldo{
background:#16a34a;
}

.box p{
margin-top:10px;
font-size:22px;
font-weight:bold;
}

table{
width:100%;
border-collapse:collapse;
}

th{
background:#16a34a;
color:white;
padding:10px;
}

td{
padding:10px;
border-bottom:1px solid #eee;
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:#fff;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
display:flex;
justify-content:space-around;
padding:10px;
}

.bottom-nav a{
text-decoration:none;
color:#444;
font-size:14px;
text-align:center;
}

.active{
color:#16a34a !important;
font-weight:bold;
}

canvas{
max-height:400px;
}

@media(max-width:600px){

.grid{
grid-template-columns:1fr;
}

}

</style>

</head>
<body>

<div class="container">

<div class="header">
<h1>📊 Laporan Keuangan</h1>
<p>Rekapitulasi Keuangan</p>
</div>

<div class="card">

<h3>📅 Filter Periode</h3>

<br>

<select id="filterBulan" class="filter">
<option value="all">Semua Transaksi</option>
</select>

</div>

<div class="grid">

<div class="box masuk">
<div>Pemasukan</div>
<p id="totalMasuk">Rp 0</p>
</div>

<div class="box keluar">
<div>Pengeluaran</div>
<p id="totalKeluar">Rp 0</p>
</div>

<div class="box saldo">
<div>Saldo</div>
<p id="saldo">Rp 0</p>
</div>

</div>

<br>

<div class="card">

<h3>📊 Pemasukan vs Pengeluaran</h3>

<br>

<canvas id="jenisChart"></canvas>

</div>

<div class="card">

<h3>📊 Pengeluaran Berdasarkan Kategori</h3>

<br>

<canvas id="kategoriChart"></canvas>

</div>

<div class="card">

<h3>📋 Ringkasan Kategori</h3>

<br>

<table>

<thead>
<tr>
<th>Jenis</th>
<th>Kategori</th>
<th>Total</th>
</tr>
</thead>

<tbody id="laporanBody"></tbody>

</table>

</div>

</div>

<div class="bottom-nav">

<a href="index.html">
🏠<br>Dashboard
</a>

<a href="transaksi.html">
➕<br>Transaksi
</a>

<a href="laporan.html" class="active">
📊<br>Laporan
</a>

<a href="profil.html">
⚙️<br>Profil
</a>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyzy9XLvpx5DSZSrOmNvL40gTeITz6WxuvMduKe9kBFDZIvuQwngtUgRMOrT_68GTxH/exec";

let jenisChart = null;
let kategoriChart = null;

function rupiah(n){
return "Rp " +
Number(n||0).toLocaleString("id-ID");
}

let filterLoaded = false;

function loadFilter(data){

if(filterLoaded) return;

const bulanSet = new Set();

data.forEach(item=>{

if(item.tanggal){

bulanSet.add(
item.tanggal.substring(0,7)
);

}

});

const select =
document.getElementById("filterBulan");

[...bulanSet]
.sort()
.reverse()
.forEach(bln=>{

select.innerHTML +=
`<option value="${bln}">
${bln}
</option>`;

});

filterLoaded = true;

}

async function loadLaporan(){

try{

const response =
await fetch(API_URL);

const data =
await response.json();

loadFilter(data);

const filter =
document.getElementById("filterBulan")
.value;

let filtered = data;

if(filter !== "all"){

filtered =
data.filter(item=>

item.tanggal &&
item.tanggal.startsWith(filter)

);

}

let masuk = 0;
let keluar = 0;

const kategoriMap = {};
const rekap = {};

filtered.forEach(item=>{

const nominal =
Number(item.nominal || 0);

const jenis =
String(item.jenis || "")
.toLowerCase();

if(
jenis==="masuk" ||
jenis==="pemasukan"
){

masuk += nominal;

}else{

keluar += nominal;

const kategori =
item.kategori || "Lainnya";

kategoriMap[kategori] =
(kategoriMap[kategori] || 0)
+ nominal;

}

const key =
(item.jenis || "") +
"|" +
(item.kategori || "");

if(!rekap[key]){

rekap[key] = {
jenis:item.jenis,
kategori:item.kategori,
total:0
};

}

rekap[key].total += nominal;

});

document.getElementById("totalMasuk")
.innerText = rupiah(masuk);

document.getElementById("totalKeluar")
.innerText = rupiah(keluar);

document.getElementById("saldo")
.innerText = rupiah(masuk-keluar);

if(jenisChart){
jenisChart.destroy();
}

jenisChart =
new Chart(
document.getElementById("jenisChart"),
{
type:"bar",

data:{
labels:[
"Pemasukan",
"Pengeluaran"
],

datasets:[{
data:[
masuk,
keluar
],

backgroundColor:[
"#22c55e",
"#ef4444"
]
}]
},

options:{
responsive:true,
plugins:{
legend:{
display:false
}
}
}
}
);

if(kategoriChart){
kategoriChart.destroy();
}

kategoriChart =
new Chart(
document.getElementById("kategoriChart"),
{
type:"bar",

data:{
labels:Object.keys(kategoriMap),

datasets:[{
label:"Pengeluaran",
data:Object.values(kategoriMap),
backgroundColor:"#16a34a"
}]
},

options:{
responsive:true,
plugins:{
legend:{
display:false
}
}
}
}
);

let html = "";

Object.values(rekap)
.sort((a,b)=>b.total-a.total)
.forEach(item=>{

html += `
<tr>
<td>${item.jenis || "-"}</td>
<td>${item.kategori || "-"}</td>
<td>${rupiah(item.total)}</td>
</tr>
`;

});

document.getElementById("laporanBody")
.innerHTML =
html ||
`
<tr>
<td colspan="3">
Tidak ada data
</td>
</tr>
`;

}catch(error){

console.error(error);

}

}

document
.getElementById("filterBulan")
.addEventListener(
"change",
loadLaporan
);

loadLaporan();

</script>

</body>
</html>
