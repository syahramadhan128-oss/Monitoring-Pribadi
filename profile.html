<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil & Pengaturan</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<script src="https://cdn.jsdelivr.net/npm/xlsx/dist/xlsx.full.min.js"></script>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:90px;
transition:.3s;
}

.container{
max-width:800px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#16a34a;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:10px;
}

label{
display:block;
margin-top:10px;
font-weight:bold;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-top:5px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

button:hover{
background:#15803d;
}

.
