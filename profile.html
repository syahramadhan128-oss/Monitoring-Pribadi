<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Profil & Pengaturan</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:90px;
transition:.3s;
}

.container{
max-width:800px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#16a34a;
}

.card{
background:#fff;
padding:15px;
border-radius:15px;
margin-bottom:15px;
box-shadow:0 2px 8px rgba(0,0,0,.1);
}

.card h3{
margin-bottom:10px;
}

input{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
margin-top:5px;
}

button{
width:100%;
padding:12px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-weight:bold;
cursor:pointer;
margin-top:10px;
}

.progress{
width:100%;
height:20px;
background:#eee;
border-radius:30px;
overflow:hidden;
margin-top:10px;
}

.progress-bar{
height:100%;
width:0%;
background:#16a34a;
}

.info{
padding:10px;
background:#f5f5f5;
border-radius:10px;
margin-top:10px;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#333;
font-size:14px;
text-align:center;
}

.active{
color:#16a34a !important;
font-weight:bold;
}

.dark{
background:#111827;
color:white;
}

.dark .card{
background:#1f2937;
color:white;
}

.dark input{
background:#374151;
color:white;
border:none;
}

.dark .bottom-nav{
background:#1f2937;
}

.dark .bottom-nav a{
color:white;
}

</style>

</head>

<body>

<div class="container">

<div class="header">
<h1>👤 Profil & Pengaturan</h1>
</div>

<div class="card">

<h3>👤 Profil Pengguna</h3>

<label>Nama</label>
<input type="text"
id="nama"
placeholder="Nama Anda">

<label>Email</label>
<input type="email"
id="email"
placeholder="email@email.com">

<button onclick="simpanProfil()">
💾 Simpan Profil
</button>

</div>

<div class="card">

<h3>🎯 Target Tabungan</h3>

<label>Nama Target</label>
<input
type="text"
id="namaTarget"
placeholder="Dana Darurat">

<label>Nominal Target</label>
<input
type="number"
id="target">

<label>Terkumpul</label>
<input
type="number"
id="terkumpul">

<button onclick="hitungTarget()">
Hitung Progress
</button>

<div class="progress">
<div
class="progress-bar"
id="progressBar">
</div>
</div>

<div
class="info"
id="hasilTarget">

Belum ada target

</div>

</div>

<div class="card">

<h3>🌙 Dark Mode</h3>

<button onclick="toggleDarkMode()">
Aktifkan / Nonaktifkan
</button>

</div>

<div class="card">

<h3>📊 Export Data</h3>

<button onclick="exportExcel()">
📈 Export Excel
</button>

<button onclick="exportPDF()">
📄 Export PDF
</button>

</div>

<div class="card">

<h3>ℹ️ Tentang Aplikasi</h3>

<p>
Keuangan Pribadi v1.0
</p>

<p>
PWA Monitoring Keuangan Pribadi
</p>

</div>

</div>

<div class="bottom-nav">

<a href="index.html">
🏠<br>
Dashboard
</a>

<a href="transaksi.html">
➕<br>
Transaksi
</a>

<a href="laporan.html">
📊<br>
Laporan
</a>

<a href="profil.html" class="active">
⚙️<br>
Profil
</a>

</div>

<script>

function simpanProfil(){

const profil = {

nama:
document.getElementById(
"nama"
).value,

email:
document.getElementById(
"email"
).value

};

localStorage.setItem(
"profil",
JSON.stringify(profil)
);

alert(
"Profil berhasil disimpan"
);

}

function loadProfil(){

const data =
localStorage.getItem(
"profil"
);

if(data){

const profil =
JSON.parse(data);

document.getElementById(
"nama"
).value =
profil.nama || "";

document.getElementById(
"email"
).value =
profil.email || "";

}

}

function hitungTarget(){

const target =
Number(
document.getElementById(
"target"
).value
);

const terkumpul =
Number(
document.getElementById(
"terkumpul"
).value
);

if(target<=0){

return;

}

const persen =
Math.min(
100,
(terkumpul/target)*100
);

document.getElementById(
"progressBar"
).style.width =
persen + "%";

document.getElementById(
"hasilTarget"
).innerHTML =

`
🎯 Progress :
<b>${persen.toFixed(1)}%</b>

<br><br>

Target :
Rp ${target.toLocaleString("id-ID")}

<br>

Terkumpul :
Rp ${terkumpul.toLocaleString("id-ID")}
`;

}

function toggleDarkMode(){

document.body.classList
.toggle("dark");

localStorage.setItem(
"darkmode",
document.body.classList.contains("dark")
);

}

function loadDarkMode(){

const dark =
localStorage.getItem(
"darkmode"
);

if(dark === "true"){

document.body.classList.add(
"dark"
);

}

}

function exportExcel(){

alert(
"Fitur Export Excel akan ditambahkan pada versi berikutnya."
);

}

function exportPDF(){

alert(
"Fitur Export PDF akan ditambahkan pada versi berikutnya."
);

}

loadProfil();
loadDarkMode();

if("serviceWorker" in navigator){

navigator.serviceWorker
.register("./sw.js");

}

</script>

</body>
</html>
