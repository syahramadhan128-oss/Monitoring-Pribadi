<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Transaksi</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    background:#f0fdf4;
    padding:15px;
    padding-bottom:90px;
}

.container{
    max-width:700px;
    margin:auto;
}

.header{
    text-align:center;
    margin-bottom:20px;
}

.header h1{
    color:#16a34a;
}

.card{
    background:#fff;
    border-radius:16px;
    padding:20px;
    box-shadow:0 2px 10px rgba(0,0,0,.1);
}

label{
    display:block;
    margin-top:15px;
    margin-bottom:5px;
    font-weight:bold;
    color:#333;
}

input,
select,
textarea{
    width:100%;
    padding:12px;
    border:1px solid #ddd;
    border-radius:10px;
    font-size:15px;
}

textarea{
    resize:none;
    height:80px;
}

button{
    width:100%;
    padding:15px;
    margin-top:20px;
    border:none;
    border-radius:12px;
    background:#16a34a;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#15803d;
}

#status{
    margin-top:15px;
    text-align:center;
    font-weight:bold;
}

.info{
    background:#dcfce7;
    padding:12px;
    border-radius:10px;
    margin-bottom:15px;
    color:#166534;
}

.bottom-nav{
    position:fixed;
    bottom:0;
    left:0;
    right:0;
    background:white;
    display:flex;
    justify-content:space-around;
    padding:12px;
    box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
    text-decoration:none;
    color:#333;
    text-align:center;
    font-size:14px;
}

.active{
    color:#16a34a !important;
    font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
    <h1>➕ Tambah Transaksi</h1>
</div>

<div class="card">

    <div class="info">
        Isi transaksi pemasukan atau pengeluaran Anda.
    </div>

    <form id="formKeuangan">

        <label>Tanggal</label>
        <input type="date" id="tanggal" required>

        <label>Jenis Transaksi</label>
        <select id="jenis" required>
            <option value="Masuk">📈 Pemasukan</option>
            <option value="Keluar">📉 Pengeluaran</option>
        </select>

        <label>Kategori</label>
        <select id="kategori" required></select>

        <label>Deskripsi</label>
        <textarea id="deskripsi"
        placeholder="Contoh: Belanja bulanan, Gaji Oktober, dll"></textarea>

        <label>Nominal</label>
        <input
            type="number"
            id="nominal"
            min="0"
            placeholder="Masukkan nominal"
            required>

        <button type="submit">
            💾 Simpan Transaksi
        </button>

    </form>

    <div id="status"></div>

</div>

</div>

<div class="bottom-nav">

    <a href="index.html">
        🏠<br>Dashboard
    </a>

    <a href="transaksi.html" class="active">
        ➕<br>Transaksi
    </a>

    <a href="laporan.html">
        📊<br>Laporan
    </a>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyzy9XLvpx5DSZSrOmNvL40gTeITz6WxuvMduKe9kBFDZIvuQwngtUgRMOrT_68GTxH/exec";

const kategoriMasuk = [
    "Gaji",
    "Bonus",
    "THR",
    "Freelance",
    "Investasi",
    "Income Lain"
];

const kategoriKeluar = [
    "Tagihan Rumah",
    "Kebutuhan Harian",
    "Cicilan Rumah",
    "Keperluan Pribadi",
    "Kendaraan",
    "Medical",
    "Baby Shop"
];

function loadKategori(){

    const jenis =
    document.getElementById("jenis").value;

    const kategori =
    document.getElementById("kategori");

    kategori.innerHTML = "";

    const data =
    jenis === "Masuk"
    ? kategoriMasuk
    : kategoriKeluar;

    data.forEach(item=>{

        kategori.innerHTML +=
        `<option value="${item}">
            ${item}
        </option>`;

    });

}

document.getElementById("tanggal").value =
new Date().toISOString().split("T")[0];

loadKategori();

document
.getElementById("jenis")
.addEventListener(
"change",
loadKategori
);

document
.getElementById("formKeuangan")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const tanggal =
document.getElementById("tanggal").value;

const jenis =
document.getElementById("jenis").value;

const kategori =
document.getElementById("kategori").value;

const deskripsi =
document.getElementById("deskripsi").value;

const nominal =
document.getElementById("nominal").value;

if(!nominal || nominal <= 0){

    document.getElementById("status")
    .innerHTML =
    "❌ Nominal harus lebih dari 0";

    return;

}

const payload = {

    tanggal,
    jenis,
    kategori,
    deskripsi,
    nominal

};

try{

    document.getElementById("status")
    .innerHTML =
    "⏳ Menyimpan data...";

    await fetch(
    API_URL,
    {
        method:"POST",
        mode:"no-cors",
        headers:{
            "Content-Type":"text/plain"
        },
        body:JSON.stringify(payload)
    });

    document.getElementById("status")
    .innerHTML =
    "✅ Data berhasil disimpan";

    document.getElementById("deskripsi")
    .value = "";

    document.getElementById("nominal")
    .value = "";

}catch(error){

    document.getElementById("status")
    .innerHTML =
    "❌ Gagal menyimpan data";

    console.error(error);

}

});

if("serviceWorker" in navigator){

    navigator.serviceWorker
    .register("./sw.js");

}

</script>

</body>
</html>
