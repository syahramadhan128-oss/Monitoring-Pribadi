<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Transaksi</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:90px;
}

.container{
max-width:700px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#16a34a;
}

.card{
background:#fff;
border-radius:16px;
padding:20px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.info{
background:#dcfce7;
color:#166534;
padding:12px;
border-radius:10px;
margin-bottom:15px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
border:1px solid #ddd;
border-radius:10px;
font-size:15px;
}

textarea{
height:80px;
resize:none;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:10px;
background:#16a34a;
color:white;
font-size:16px;
font-weight:bold;
cursor:pointer;
}

button:hover{
background:#15803d;
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.bottom-nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:white;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
}

.bottom-nav a{
text-decoration:none;
color:#333;
font-size:14px;
text-align:center;
}

.active{
color:#16a34a !important;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>➕ Tambah Transaksi</h1>
</div>

<div class="card">

<div class="info">
Masukkan transaksi pemasukan atau pengeluaran.
</div>

<form id="formKeuangan">

<label>Tanggal</label>
<input type="date" id="tanggal" required>

<label>Jenis Transaksi</label>

<select id="jenis">

<option value="Masuk">
📈 Pemasukan
</option>

<option value="Keluar">
📉 Pengeluaran
</option>

</select>

<label>Kategori</label>

<select id="kategori"></select>

<label>Deskripsi</label>

<textarea
id="deskripsi"
placeholder="Contoh: Belanja Bulanan">
</textarea>

<label>Nominal</label>

<input
type="number"
id="nominal"
min="1"
required
placeholder="Masukkan nominal">

<button type="submit">
💾 Simpan Transaksi
</button>

</form>

<div id="status"></div>

</div>

</div>

<div class="bottom-nav">

<a href="index.html">
🏠<br>Dashboard
</a>

<a href="transaksi.html" class="active">
➕<br>Transaksi
</a>

<a href="laporan.html">
📊<br>Laporan
</a>

<a href="profil.html">
⚙️<br>Profil
</a>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyzy9XLvpx5DSZSrOmNvL40gTeITz6WxuvMduKe9kBFDZIvuQwngtUgRMOrT_68GTxH/exec";

const kategoriMasuk = [
"Gaji",
"Bonus",
"THR",
"Freelance",
"Investasi",
"Income Lain"
];

const kategoriKeluar = [
"Tagihan Rumah",
"Kebutuhan Harian",
"Cicilan Rumah",
"Keperluan Pribadi",
"Kendaraan",
"Medical",
"Baby Shop"
];

function loadKategori(){

const jenis =
document.getElementById("jenis").value;

const kategori =
document.getElementById("kategori");

kategori.innerHTML = "";

const daftarKategori =
jenis === "Masuk"
? kategoriMasuk
: kategoriKeluar;

daftarKategori.forEach(item=>{

kategori.innerHTML += `
<option value="${item}">
${item}
</option>
`;

});

}

document.getElementById("tanggal").value =
new Date().toISOString().split("T")
