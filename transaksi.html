<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Tambah Transaksi</title>

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#16a34a">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f0fdf4;
padding:15px;
padding-bottom:100px;
}

.container{
max-width:800px;
margin:auto;
}

.header{
text-align:center;
margin-bottom:20px;
}

.header h1{
color:#16a34a;
}

.card{
background:#fff;
padding:20px;
border-radius:16px;
box-shadow:0 2px 10px rgba(0,0,0,.1);
}

.info{
background:#dcfce7;
padding:12px;
border-radius:10px;
color:#166534;
margin-bottom:15px;
}

label{
display:block;
margin-top:15px;
margin-bottom:5px;
font-weight:bold;
}

input,
select,
textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #ddd;
font-size:15px;
}

textarea{
height:100px;
resize:none;
}

button{
width:100%;
padding:14px;
margin-top:20px;
border:none;
border-radius:10px;
background:#16a34a;
color:#fff;
font-weight:bold;
font-size:16px;
cursor:pointer;
}

button:hover{
background:#15803d;
}

#status{
margin-top:15px;
text-align:center;
font-weight:bold;
}

.bottom-nav{
position:fixed;
left:0;
right:0;
bottom:0;
background:#fff;
display:flex;
justify-content:space-around;
padding:12px;
box-shadow:0 -2px 10px rgba(0,0,0,.1);
z-index:9999;
}

.bottom-nav a{
text-decoration:none;
color:#444;
font-size:14px;
text-align:center;
}

.active{
color:#16a34a !important;
font-weight:bold;
}

</style>
</head>

<body>

<div class="container">

<div class="header">
<h1>➕ Tambah Transaksi</h1>
</div>

<div class="card">

<div class="info">
Masukkan transaksi pemasukan atau pengeluaran.
</div>

<form id="formKeuangan">

<label>Tanggal</label>
<input
type="date"
id="tanggal"
required>

<label>Jenis Transaksi</label>
<select id="jenis">

<option value="Masuk">
📈 Pemasukan
</option>

<option value="Keluar">
📉 Pengeluaran
</option>

</select>

<label>Kategori</label>
<select id="kategori"></select>

<label>Deskripsi</label>
<textarea
id="deskripsi"
placeholder="Contoh: Gaji Bulanan, Belanja Bulanan">
</textarea>

<label>Nominal</label>
<input
type="number"
id="nominal"
required
min="1"
placeholder="Masukkan nominal">

<button type="submit">
💾 Simpan Transaksi
</button>

</form>

<div id="status"></div>

</div>

</div>

<div class="bottom-nav">

<a href="index.html">
🏠<br>Dashboard
</a>

<a href="transaksi.html" class="active">
➕<br>Transaksi
</a>

<a href="laporan.html">
📊<br>Laporan
</a>

<a href="profil.html">
⚙️<br>Profil
</a>

</div>

<script>

const API_URL =
"https://script.google.com/macros/s/AKfycbyzy9XLvpx5DSZSrOmNvL40gTeITz6WxuvMduKe9kBFDZIvuQwngtUgRMOrT_68GTxH/exec";

const kategoriMasuk = [
"Gaji",
"Bonus",
"THR",
"Freelance",
"Investasi",
"Income Lain"
];

const kategoriKeluar = [
"Tagihan Rumah",
"Kebutuhan Harian dan Bulanan",
"Cicilan Rumah Kiramland",
"Keperluan Pribadi",
"Keperluan Kendaraan",
"Kesehatan/Medical",
"Keperluan Bayi"
];

function loadKategori(){

const jenis =
document.getElementById("jenis").value;

const kategori =
document.getElementById("kategori");

kategori.innerHTML = "";

const data =
jenis === "Masuk"
? kategoriMasuk
: kategoriKeluar;

data.forEach(item=>{

const option =
document.createElement("option");

option.value = item;
option.textContent = item;

kategori.appendChild(option);

});

}

function setTanggalHariIni(){

document.getElementById("tanggal").value =
new Date().toISOString().split("T")[0];

}

document
.getElementById("jenis")
.addEventListener(
"change",
loadKategori
);

document
.getElementById("formKeuangan")
.addEventListener(
"submit",
async function(e){

e.preventDefault();

const status =
document.getElementById("status");

const payload = {

tanggal:
document.getElementById("tanggal").value,

jenis:
document.getElementById("jenis").value,

kategori:
document.getElementById("kategori").value,

deskripsi:
document.getElementById("deskripsi").value,

nominal:
Number(
document.getElementById("nominal").value
)

};

if(payload.nominal <= 0){

status.innerHTML =
"❌ Nominal harus lebih dari 0";

status.style.color = "red";

return;

}

try{

status.innerHTML =
"⏳ Menyimpan data...";

status.style.color =
"#f59e0b";

const response =
await fetch(API_URL,{
method:"POST",
body:JSON.stringify(payload)
});

console.log(response);

status.innerHTML =
"✅ Data berhasil disimpan";

status.style.color =
"green";

document
.getElementById("formKeuangan")
.reset();

setTanggalHariIni();

loadKategori();

setTimeout(()=>{

window.location.href =
"index.html";

},1000);

}catch(error){

console.error(error);

status.innerHTML =
"❌ Gagal menyimpan data";

status.style.color =
"red";

}

});

setTanggalHariIni();
loadKategori();

if("serviceWorker" in navigator){

window.addEventListener("load",()=>{

navigator.serviceWorker
.register("sw.js")
.then(()=>{
console.log(
"Service Worker aktif"
);
})
.catch(err=>{
console.error(err);
});

});

}

</script>

</body>
</html>
